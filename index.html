<canvas id="cv"></canvas>

<div id="top" class="hud">
  <div class="res" title="Hrană">🌾<b id="rf">0</b></div>
  <div class="res" title="Lemn">🪵<b id="rw">0</b></div>
  <div class="res" title="Aur">🪙<b id="rg">0</b></div>
  <div class="res" title="Piatră">🪨<b id="rs">0</b></div>
  <div class="res" title="Oameni / locuri">👥<b id="pop">0</b></div>
  <div id="age"></div><div id="clock"></div>
  <div class="grow"></div>
  <div id="plist"></div>
  <button class="tb" id="bFull" title="Ecran complet">⛶</button>
  <button class="tb" id="bSpeed" title="Viteza jocului">1×</button>
  <button class="tb" id="bChat" title="Mesaje, strigăte, coduri (Enter)">💬</button>
  <button class="tb" id="bMusic" title="Muzica">🎵</button>
  <button class="tb" id="bSound" title="Sunet">🔊</button>
  <button class="tb" id="bMenu" title="Pauză">☰</button>
</div>
<div id="msgs"></div>
<div id="ageBan"><div class="r"></div><div class="n"></div><div class="s"></div></div>
<input id="chat" type="text" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Scrie un mesaj, un strigăt (1–12) sau un cod secret, apoi Enter">
<div id="tip"></div>
<div id="quick" class="hud">
  <button id="bIdle" title="Țăranii fără treabă">💤<b>0</b></button>

  <button id="bHome" title="Cetatea ta">🏰</button>

  <button id="bZout" class="zb" title="Mai departe (PageDown)">－</button>
</div>
<div id="bottom" class="hud">
  <canvas id="mini"></canvas>
  <div id="info"></div>
  <div id="cmds"></div>
</div>

<div id="start" class="ov on">
  <div class="startbox">
    <div class="startleft">
      <div id="startArt"></div>
      <h1>Ștefan cel Mare</h1>
      <div class="sub">Șase țări · cinci epoci · o singură coroană</div>
      <div id="intro"></div>
      <div id="fact"></div>
    </div>
    <div class="startright">
      <button class="btn" id="bContinue" style="display:none">▶ Continuă jocul <small></small></button>
      <button class="btn big" id="bCamp">📜 Campanii <small>Poveștile lui Ștefan, Vlad, Iancu și Mehmed</small></button>
      <button class="btn big" id="bSkirmish">⚔️ Bătălie liberă <small>Alegi civilizația, adversarii, harta și epoca</small></button>
      <button class="btn" id="bQuick">⚡ Joc rapid <small>Cu ultimele setări</small></button>
      <div class="row2"><button class="btn" id="bTree">🌳 Tehnologii</button><button class="btn" id="bMedals">🏅 Medalii</button><button class="btn" id="bHelp">❔ Cum se joacă</button></div>
    </div>
  </div>
</div>

<div id="camp" class="ov" style="z-index:36"><div class="panel wide xl" id="campBox"></div></div>
<div id="story" class="ov" style="z-index:37"><div class="panel wide xl" id="storyBox"></div></div>
<div id="setup" class="ov" style="z-index:35"><div class="panel wide" id="setupBox"></div></div>
<div id="tree" class="ov" style="z-index:45"><div class="panel wide" id="treeBox"></div></div>

<div id="menu" class="ov">
  <div class="panel" style="max-width:340px">
    <h2>Pauză</h2>
    <button class="btn" id="mResume">Continuă</button>
    <button class="btn" id="mHelp">Cum se joacă</button>
    <button class="btn" id="mTree">Arborele tehnologiilor</button>
    <button class="btn" id="mExit">Salvează și ieși <small>Îl reiei de pe ecranul de start</small></button>
  </div>
</div>

<div id="help" class="ov" style="z-index:40">
  <div class="panel">
    <h2>Cum se joacă</h2>
    <ul id="helpList"></ul>
    <button class="btn" id="helpClose">Am înțeles</button>
  </div>
</div>

<div id="end" class="ov">
  <div class="panel" style="max-width:640px">
    <h2 id="endT"></h2>
    <div id="endS"></div>
    <table id="endStats"></table>
    <canvas id="endGraph"></canvas>
    <button class="btn go" id="eNext" style="display:none">Misiunea următoare ▶</button>
    <div class="row2"><button class="btn" id="eRetry">Mai joacă o dată</button><button class="btn" id="eAgain">Meniul principal</button></div>
  </div>
</div>

<div id="objs" style="display:none"></div>
<div id="say"></div>
