<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a140e">
<title>Ștefan cel Mare — Apărarea Moldovei</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0d0c0a; overflow: hidden; color: #f3ead6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  .hud { display: none; }
  body.playing .hud { display: flex; }

  #top { position: fixed; top: 0; left: 0; right: 0; height: 32px; align-items: center; gap: 4px; z-index: 5;
    padding: 0 6px 0 max(8px, env(safe-area-inset-left)); background: linear-gradient(#2c2015f0, #1d160edd); border-bottom: 1px solid #7a5a2a; font-size: 14px; }
  .res { display: flex; align-items: center; gap: 3px; min-width: 56px; }
  .res b { font-weight: 700; }
  .res.full b { color: #ff7a6a; }
  #age { margin-left: 4px; color: #e8c86a; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { color: #b8ad98; font-size: 12px; margin-left: 6px; }
  .grow { flex: 1; }
  .tb { width: 34px; height: 26px; border: 1px solid #8a6a3a; border-radius: 5px; background: #3a2c1c; font-size: 13px; padding: 0; }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: 104px; gap: 6px; z-index: 5;
    padding: 5px max(5px, env(safe-area-inset-right)) 5px max(5px, env(safe-area-inset-left));
    background: linear-gradient(#21180fe8, #130e09f5); border-top: 1px solid #7a5a2a; }
  #mini { width: 136px; height: 93px; flex: none; background: #0d0c0a; border: 1px solid #5a4a2a; border-radius: 5px; touch-action: none; }
  #info { width: 28%; min-width: 160px; max-width: 270px; font-size: 12px; line-height: 1.3; overflow: hidden; flex: none; }
  #info .nm { font-weight: 700; font-size: 13.5px; color: #f6e2b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .nm em { color: #ff8a7a; font-weight: 400; font-style: normal; font-size: 12px; }
  #info .st { margin-top: 2px; }
  #info .dim { color: #b8ad98; font-size: 11px; }
  #info .warn { color: #ffb36a; }
  #info .hint { color: #e8dcc0; font-size: 12.5px; padding-top: 4px; }
  .hp { position: relative; height: 12px; margin: 3px 0; background: #3a1d18; border-radius: 3px; overflow: hidden; }
  .hp div { height: 100%; }
  .hp span { position: absolute; inset: 0; font-size: 9.5px; line-height: 12px; text-align: center; color: #fff; text-shadow: 0 0 2px #000; }
  .grp { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 3px; font-size: 11.5px; }
  .grp img { width: 18px; height: 18px; vertical-align: middle; }
  .q { display: flex; gap: 3px; margin-top: 3px; }
  .qi { position: relative; width: 30px; height: 30px; border: 1px solid #8a6a3a; border-radius: 4px; background: #2e2416; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .qi img { width: 26px; height: 26px; }
  .qi .em { font-size: 16px; }
  .qi i { position: absolute; left: 0; bottom: 0; height: 3px; background: #7fb6ff; }

  #cmds { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); grid-auto-rows: 45px; gap: 3px; align-content: start; overflow-y: auto; }
  .cb { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 1px 1px 0; border: 1px solid #8a6a3a; border-radius: 6px;
    background: linear-gradient(#4b3b25, #2d2315); overflow: hidden; min-width: 0; }
  .cb img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .cb .em { font-size: 17px; line-height: 24px; height: 24px; flex: none; }
  .cb b { font-weight: 600; font-size: 9px; line-height: 10px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .cb s, .cb u { text-decoration: none; font-size: 8.5px; line-height: 10px; white-space: nowrap; color: #e6d9b8; }
  .cb s i { font-style: normal; margin: 0 1px; }
  .cb u { color: #e8c86a; }
  .cb.dis { opacity: 0.5; filter: grayscale(0.7); }
  .cb.lock { opacity: 0.32; }
  .cb.age { border-color: #e8c86a; box-shadow: 0 0 7px #e8c86a99 inset; }
  .cb.ok { grid-column: span 2; background: linear-gradient(#4d9a45, #2c632a); font-size: 15px; justify-content: center; }
  .cb.ok b, .cb.no b { font-size: 12px; line-height: 14px; }
  .cb.no { background: linear-gradient(#94403a, #5e2727); justify-content: center; }
  .cb:active { transform: scale(0.93); }

  #quick { position: fixed; right: max(6px, env(safe-area-inset-right)); bottom: 112px; flex-direction: column; gap: 6px; z-index: 5; }
  #quick button { width: 46px; height: 40px; border: 1px solid #8a6a3a; border-radius: 8px; background: #2d2315e6; font-size: 18px; position: relative; padding: 0; }
  #quick b { position: absolute; right: 2px; bottom: 1px; font-size: 10px; }
  #quick .hot { border-color: #ffd36a; box-shadow: 0 0 8px #ffd36a99; }

  #msgs { position: fixed; top: 38px; left: 50%; transform: translateX(-50%); width: min(70vw, 560px); z-index: 6; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
  .msg { pointer-events: none; background: #1d160ee8; border: 1px solid #7a5a2a; border-radius: 6px; padding: 4px 10px; font-size: 13px; text-align: center; transition: opacity .5s; }
  .msg[data-x] { pointer-events: auto; cursor: pointer; }
  .msg.alert { border-color: #ff5a4a; color: #ffd0c8; background: #3a1410ee; }
  .msg.warn { border-color: #e8a24a; color: #ffe2b8; }
  .msg.good { border-color: #6ac06a; color: #d8ffd0; }
  .msg.out { opacity: 0; }

  .ov { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #0d0a07e0; padding: 12px; }
  .ov.on { display: flex; }
  .panel { background: linear-gradient(#2f2216, #1c140c); border: 2px solid #9a7438; border-radius: 12px; padding: 16px 20px; max-width: 560px; width: 100%; max-height: 100%; overflow: auto;
    box-shadow: 0 10px 40px #000a; text-align: center; }
  .panel h2 { margin: 0 0 8px; color: #f0cf7a; font-family: Georgia, "Times New Roman", serif; }
  .btn { display: block; width: 100%; margin: 8px 0; padding: 11px; border: 1px solid #c09450; border-radius: 9px; background: linear-gradient(#6a4a26, #3e2b16); font-size: 16px; font-weight: 600; }
  .btn small { display: block; font-weight: 400; font-size: 12px; color: #d8c9a8; }

  #start { display: none; background: radial-gradient(ellipse at 50% 30%, #4a2a18 0%, #1d120a 60%, #0b0806 100%); z-index: 30; overflow: auto; }
  #start.on { display: flex; }
  .startbox { display: flex; gap: 22px; align-items: center; max-width: 900px; width: 100%; }
  .startleft { flex: 1.2; text-align: center; }
  .startright { flex: 1; min-width: 220px; }
  #start h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 6vw, 46px); color: #f3d27a; text-shadow: 0 3px 0 #5a2a10, 0 0 24px #c0802080; letter-spacing: 0.5px; }
  #start .sub { color: #e8c8a0; font-size: 14px; margin: 2px 0 8px; letter-spacing: 2px; text-transform: uppercase; }
  #startArt { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 96px; }
  #startArt img { width: 64px; height: 64px; }
  #startArt img.big { width: 110px; height: 110px; }
  #intro { font-size: 13.5px; line-height: 1.45; color: #e8dcc0; margin: 6px 0; }
  #fact { font-size: 12px; color: #b8a888; font-style: italic; margin-top: 6px; }
  .diffs { display: flex; gap: 8px; }
  .diffs .btn { margin: 6px 0; }
  #helpList { text-align: left; padding: 0; margin: 6px 0; list-style: none; font-size: 14px; line-height: 1.4; }
  #helpList li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid #ffffff14; }
  #helpList li span { width: 34px; flex: none; text-align: center; font-size: 18px; }
  #endT { font-size: 40px; margin: 0; font-family: Georgia, serif; }
  #endT.win { color: #f3d27a; } #endT.lose { color: #ff8a7a; }
  #endStats { margin: 10px auto; border-collapse: collapse; font-size: 14px; }
  #endStats td, #endStats th { padding: 4px 12px; border-bottom: 1px solid #ffffff18; }
  #endStats td:first-child { text-align: left; color: #c8b898; }

  #tip { position: fixed; z-index: 30; display: none; max-width: 290px; background: #1c140cf4; border: 1px solid #b8913f; border-radius: 7px; padding: 7px 11px; font-size: 13px; line-height: 1.35; color: #f0e6cf; pointer-events: none; box-shadow: 0 6px 22px #000b; }
  #tip b { color: #f6d58a; font-size: 14px; } #tip kbd { background: #3a2c1c; border: 1px solid #8a6a3a; border-radius: 3px; padding: 0 5px; font: 11px monospace; margin-left: 6px; color: #f6d58a; }
  #tip .tc { margin: 3px 0; } #tip .tc i { font-style: normal; margin-right: 6px; } #tip .te { color: #ffb36a; margin-top: 4px; }
  .cb .hk { display: none; }
  .portrait { float: left; width: 46px; height: 46px; margin: 0 8px 0 0; border: 1px solid #8a6a3a; border-radius: 5px; background: radial-gradient(#4a3a24, #1e160c); }
  body.desk #top { height: 40px; font-size: 16px; gap: 8px; padding-left: 12px; }
  body.desk .res { min-width: 78px; }
  body.desk .tb { width: 40px; height: 30px; font-size: 15px; }
  body.desk #bottom { height: 176px; padding: 9px 14px; gap: 14px; background: linear-gradient(#2c2014f6, #150e08fb); border-top: 2px solid #b8913f; box-shadow: 0 -5px 20px #0009; }
  body.desk #cmds { order: 1; flex: none; width: 382px; grid-template-columns: repeat(5, 72px); grid-auto-rows: 50px; gap: 4px; overflow: visible; }
  body.desk #info { order: 2; flex: 1; width: auto; max-width: none; min-width: 200px; font-size: 13.5px; padding: 4px 6px; border-left: 1px solid #5a4528; border-right: 1px solid #5a4528; }
  body.desk #mini { order: 3; width: 300px; height: 156px; border: 2px solid #8a6a3a; }
  body.desk .cb { padding-top: 3px; border-radius: 7px; border-color: #9a7a44; box-shadow: inset 0 1px 0 #ffffff22, 0 2px 4px #0006; }
  body.desk .cb:hover { border-color: #f0c860; filter: brightness(1.15); }
  body.desk .cb { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; padding: 2px 3px; }
  body.desk .cb img { width: 36px; height: 36px; margin-right: 1px; } body.desk .cb .em { font-size: 22px; line-height: 34px; height: 34px; width: 30px; text-align: center; }
  body.desk .cb b { width: 100%; text-align: center; }
  body.desk .cb s, body.desk .cb u { position: absolute; right: 3px; top: 2px; text-align: right; line-height: 10px; white-space: normal; width: 30px; }
  body.desk .cb b { font-size: 10px; line-height: 11px; } body.desk .cb s, body.desk .cb u { font-size: 9.5px; }
  body.desk .cb .hk { display: block; position: absolute; left: 4px; top: 2px; font-style: normal; font-weight: 700; font-size: 9px; color: #f6d58a; opacity: 0.9; }
  body.desk #quick { bottom: 186px; right: 14px; flex-direction: row; } body.desk #quick button { width: 54px; height: 46px; font-size: 20px; }
  body.desk #info .nm { font-size: 17px; } body.desk .hp { height: 15px; max-width: 330px; } body.desk .hp span { font-size: 11px; line-height: 15px; }
  body.desk .portrait { width: 84px; height: 84px; margin-right: 12px; }
  body.desk .qi { width: 42px; height: 42px; } body.desk .qi img { width: 38px; height: 38px; }
  body.desk #msgs { top: 50px; } body.desk .msg { font-size: 14px; }
  body.desk .grp { font-size: 13px; } body.desk .grp img { width: 26px; height: 26px; }
  #rotate { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #120d08; font-size: 18px; text-align: center; padding: 30px; }
  #rotate div { font-size: 56px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.playing #rotate { display: flex; } .startbox { flex-direction: column; gap: 6px; } .startright { width: 100%; } }
  @media (max-height: 340px) { #bottom { height: 96px; } #cmds { grid-auto-rows: 41px; } #mini { height: 85px; width: 120px; } #quick { bottom: 102px; } }
  @media (max-width: 720px) { #info { min-width: 130px; width: 24%; } #mini { width: 112px; } .res { min-width: 48px; font-size: 13px; } #age { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top" class="hud">
  <div class="res" title="Hrană">🌾<b id="rf">0</b></div>
  <div class="res" title="Lemn">🪵<b id="rw">0</b></div>
  <div class="res" title="Aur">🪙<b id="rg">0</b></div>
  <div class="res" title="Piatră">🪨<b id="rs">0</b></div>
  <div class="res" title="Oameni / locuri">👥<b id="pop">0</b></div>
  <div id="age"></div><div id="clock"></div>
  <div class="grow"></div>
  <button class="tb" id="bSpeed" title="Viteza jocului">1×</button>
  <button class="tb" id="bSound" title="Sunet">🔊</button>
  <button class="tb" id="bMenu" title="Pauză">☰</button>
</div>
<div id="msgs"></div>
<div id="tip"></div>
<div id="quick" class="hud">
  <button id="bIdle" title="Țăranii fără treabă">💤<b>0</b></button>
  <button id="bArmy" title="Toată oastea (apasă de două ori ca s-o vezi)">⚔️</button>
  <button id="bHome" title="Cetatea ta">🏰</button>
</div>
<div id="bottom" class="hud">
  <canvas id="mini"></canvas>
  <div id="info"></div>
  <div id="cmds"></div>
</div>

<div id="start" class="ov on">
  <div class="startbox">
    <div class="startleft">
      <div id="startArt"></div>
      <h1>Ștefan cel Mare</h1>
      <div class="sub">Apărarea Moldovei · 1475</div>
      <div id="intro"></div>
      <div id="fact"></div>
    </div>
    <div class="startright">
      <button class="btn" id="bContinue" style="display:none">Continuă jocul <small></small></button>
      <div style="font-size:13px;color:#d8c9a8;margin-top:6px">Joc nou:</div>
      <div class="diffs">
        <button class="btn" data-diff="usor">Ușor</button>
        <button class="btn" data-diff="normal">Normal</button>
        <button class="btn" data-diff="greu">Greu</button>
      </div>
      <button class="btn" id="bHelp">Cum se joacă</button>
    </div>
  </div>
</div>

<div id="menu" class="ov">
  <div class="panel" style="max-width:340px">
    <h2>Pauză</h2>
    <button class="btn" id="mResume">Continuă</button>
    <button class="btn" id="mHelp">Cum se joacă</button>
    <button class="btn" id="mExit">Salvează și ieși <small>Îl reiei de pe ecranul de start</small></button>
  </div>
</div>

<div id="help" class="ov" style="z-index:40">
  <div class="panel">
    <h2>Cum se joacă</h2>
    <ul id="helpList"></ul>
    <button class="btn" id="helpClose">Am înțeles</button>
  </div>
</div>

<div id="end" class="ov">
  <div class="panel" style="max-width:420px">
    <h2 id="endT"></h2>
    <div id="endS"></div>
    <table id="endStats"></table>
    <button class="btn" id="eAgain">Înapoi la început</button>
  </div>
</div>

<div id="rotate"><div>📱</div>Întoarce telefonul pe orizontală</div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/path.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/voci.js" onerror="void 0"></script>
<script src="js/audio.js"></script>
<script src="assets/sprites.js"></script>
<script src="js/tex.js"></script>
<script src="js/gfx-terrain.js"></script>
<script src="js/gfx-sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
